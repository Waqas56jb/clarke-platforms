services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clarke_social
      POSTGRES_USER: clarke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Localhost only, for development. Never publish the database publicly.
      - '127.0.0.1:5433:5432'
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clarke -d clarke_social']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  social_postgres_data:
