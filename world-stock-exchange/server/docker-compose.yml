services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wse
      POSTGRES_USER: wse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Localhost only, for development. Never publish the database publicly.
      - '127.0.0.1:5434:5432'
    volumes:
      - wse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wse -d wse']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  wse_postgres_data:
